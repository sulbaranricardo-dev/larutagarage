<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Póster IG | La Ruta Garage</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --neon: #d8ff5e; 
            --bg: #000000; 
            --glass: rgba(18, 18, 18, 0.75); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur: blur(15px);
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #111; 
            font-family: 'RBNo3.1', 'Montserrat', sans-serif; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTROLES DEL ADMINISTRADOR --- */
        .admin-controls {
            background: #1a1a1a;
            padding: 15px;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .filter-row { display: flex; align-items: center; gap: 10px; }
        .btn-pill { 
            padding: 10px 25px; 
            background: #222; 
            color: #aaa; 
            border: 1px solid #444; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-pill:hover { background: #333; color: white; }
        .btn-pill.active { background: var(--neon); color: black; border-color: var(--neon); box-shadow: 0 0 15px rgba(216, 255, 94, 0.2); }
        .page-indicator { color: white; font-weight: 900; font-size: 0.9rem; width: 130px; text-align: center; text-transform: uppercase; letter-spacing: 1px;}

        /* --- CONTENEDOR DEL PÓSTER (DIMENSIONES EXACTAS 3:4 INSTAGRAM) --- */
        #poster-container {
            width: 1080px; 
            height: 1440px; 
            padding: 60px 45px; 
            background-color: var(--bg); 
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* HEADER DEL PÓSTER */
        .poster-header { text-align: center; margin-bottom: 35px; }
        .poster-header img { width: 140px; margin-bottom: 12px; filter: drop-shadow(0 0 15px rgba(216, 255, 94, 0.4)); }
        .poster-header h1 { font-weight: 900; color: white; font-size: 38px; text-transform: uppercase; margin: 0; letter-spacing: 4px; }
        .poster-header h2 { font-weight: 600; color: var(--neon); font-size: 20px; text-transform: uppercase; margin: 5px 0 0 0; letter-spacing: 2px; }

        /* --- GRID DE ATLETAS --- */
        #leaderboard-list { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 14px; 
            align-content: start; 
        }

        /* ITEM STANDAR (A PARTIR DEL 4TO LUGAR) */
        .athlete-card {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            height: 90px; 
        }

        /* --- DISEÑO EXCLUSIVO PARA EL PODIO (FILA COMPLETA) --- */
        .athlete-card.top-1, .athlete-card.top-2, .athlete-card.top-3 {
            grid-column: span 2 !important; 
            height: 120px; 
            padding: 20px 30px;
        }

        /* DESTELLOS Y BORDES LLAMATIVOS PARA EL TOP 3 */
        .athlete-card.top-1 { 
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.22) 0%, rgba(15, 15, 15, 0.95) 100%);
            border: 2px solid #ffd700; 
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25); 
        }
        .athlete-card.top-2 { 
            background: linear-gradient(90deg, rgba(192, 192, 192, 0.15) 0%, rgba(15, 15, 15, 0.95) 100%);
            border: 2px solid #c0c0c0; 
            box-shadow: 0 0 25px rgba(192, 192, 192, 0.15);
        }
        .athlete-card.top-3 { 
            background: linear-gradient(90deg, rgba(205, 127, 50, 0.15) 0%, rgba(15, 15, 15, 0.95) 100%);
            border: 2px solid #cd7f32; 
            box-shadow: 0 0 25px rgba(205, 127, 50, 0.15);
        }

        /* BADGE FLOTANTE DE GANADOR ABSOLUTO */
        .absolute-badge {
            background: #ffd700;
            color: black;
            font-weight: 900;
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.5);
            width: fit-content;
        }

        /* COMPONENTES INTERNOS DE LA TARJETA */
        .card-left { display: flex; align-items: center; gap: 15px; flex: 0 0 auto; }
        .rank-box { width: 45px; text-align: center; }
        
        .rank-number { font-weight: 900; font-size: 26px; color: #fff; }
        .top-1 .rank-number { color: #ffd700; font-size: 34px; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .top-2 .rank-number { color: #c0c0c0; font-size: 32px; }
        .top-3 .rank-number { color: #cd7f32; font-size: 30px; }
        .rank-icon { font-size: 26px; color: #ffd700; }

        .avatar-box { position: relative; }
        .avatar-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #333; background: #222; }
        .top-1 .avatar-img { width: 75px; height: 75px; border-color: #ffd700; }
        .top-2 .avatar-img { width: 70px; height: 70px; border-color: #c0c0c0; }
        .top-3 .avatar-img { width: 68px; height: 68px; border-color: #cd7f32; }
        
        .dorsal-tag {
            position: absolute;
            bottom: -5px; right: -5px;
            background: var(--bg);
            color: var(--neon);
            font-weight: 900;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--neon);
            font-family: monospace;
        }
        .top-1 .dorsal-tag { font-size: 12px; padding: 3px 7px; border-color: #ffd700; color: #ffd700; }

        .card-center { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            padding: 0 15px;
            min-width: 0; 
        }
        .athlete-name { 
            font-size: 16px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: white; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .top-1 .athlete-name { font-size: 22px; }
        .top-2 .athlete-name { font-size: 19px; }
        .top-3 .athlete-name { font-size: 18px; }

        .athlete-meta { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .top-1 .athlete-meta, .top-2 .athlete-meta, .top-3 .athlete-meta { font-size: 11px; }
        
        .athlete-box { font-size: 11px; color: var(--neon); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .top-1 .athlete-box { color: #ffd700; font-size: 12px; }

        .card-right { flex: 0 0 auto; text-align: right; }
        .time-display { font-weight: 900; font-size: 20px; color: white; font-family: 'Montserrat', monospace; }
        .top-1 .time-display { font-size: 28px; }
        .top-2 .time-display { font-size: 24px; }
        .top-3 .time-display { font-size: 22px; }

        .poster-footer {
            position: absolute;
            bottom: 30px;
            width: calc(100% - 90px);
            text-align: center;
            color: #444;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .poster-loader { text-align: center; padding: 100px; color: var(--neon); font-size: 2rem; font-weight: 900; }

        @media print {
            .admin-controls { display: none !important; }
            body { background: #000; }
            #poster-container { box-shadow: none; border: none; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="admin-controls">
        <div class="filter-row">
            <button class="btn-pill active" id="sex-Masculino" onclick="cambiarSexo('Masculino')">Hombres ♂</button>
            <button class="btn-pill" id="sex-Femenino" onclick="cambiarSexo('Femenino')">Mujeres ♀</button>
        </div>
        <div class="filter-row">
            <button class="btn-pill" onclick="cambiarPagina(-1)"><i class="fas fa-chevron-left"></i></button>
            <span class="page-indicator" id="ui-page-indicator">Pág 1</span>
            <button class="btn-pill" onclick="cambiarPagina(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="poster-loader" class="poster-loader">
        <i class="fas fa-circle-notch fa-spin"></i> CALCULANDO LÍDERES GENERALES...
    </div>

    <div id="poster-container" style="display:none;">
        
        <div class="poster-header">
            <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FLogo%20Icono%20Verde.png?alt=media&token=07ce2638-9667-4bad-8de1-c38abc5112f8" alt="Logo">
            <h1>LA RUTA GARAGE</h1>
            <h2 id="poster-subtitle">TABLA GENERAL RACE - HOMBRES</h2>
        </div>

        <div id="leaderboard-list"></div>

        <div class="poster-footer" id="poster-footer-text">1 / 3</div>

    </div>

    <script>
        const SUPABASE_URL = 'https://hzywpjzvlvdxscgtebvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6eXdwanp2bHZkeHNjZ3RlYnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjI0OTQsImV4cCI6MjA5NDYzODQ5NH0.L7gdDpxOD7N1gpSoCVI0FEiwxR44sG8XwAORYm16sEM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let atletas = [];
        let sexoActual = 'Masculino'; 
        
        let currentPage = 1;
        let totalPages = 1;
        let atletasProcesados = []; 

        function convertirDriveUrl(url) {
            if (!url || url.trim() === "") return "https://ui-avatars.com/api/?name=LRG&background=222&color=fff";
            let match = url.match(/\/d\/(.*?)\//);
            return match && match[1] ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w300-h300` : url;
        }

        function calcularEdad(fechaNacStr) {
            if (!fechaNacStr) return 'N/A';
            let nacimiento = new Date(fechaNacStr);
            if (isNaN(nacimiento.getTime())) return 'N/A';
            let hoy = new Date();
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            let m = hoy.getMonth() - nacimiento.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) { edad--; }
            return edad;
        }

        function scoreToSecondsRace(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "") return Infinity;
            let partes = scoreStr.split(':');
            if (partes.length === 2) return (parseInt(partes[0]) || 0) * 60 + parseFloat(partes[1] || 0);
            let num = parseFloat(scoreStr);
            return isNaN(num) ? Infinity : num;
        }

        async function inicializarPoster() {
            const { data: dataAtletas } = await supabaseClient.from('atletas').select('*');
            if(dataAtletas) atletas = dataAtletas;
            
            document.getElementById('poster-loader').style.display = 'none';
            document.getElementById('poster-container').style.display = 'flex';
            prepararLista();
        }

        function cambiarSexo(nuevoSexo) {
            sexoActual = nuevoSexo;
            currentPage = 1; 
            
            document.querySelectorAll('.btn-pill').forEach(b => b.classList.remove('active'));
            document.getElementById(`sex-${nuevoSexo}`).classList.add('active');
            
            const textoSexo = nuevoSexo === 'Masculino' ? 'HOMBRES' : 'MUJERES';
            document.getElementById('poster-subtitle').innerText = `TABLA GENERAL RACE - ${textoSexo}`;
            
            prepararLista();
        }

        function cambiarPagina(delta) {
            let nuevaPagina = currentPage + delta;
            if (nuevaPagina >= 1 && nuevaPagina <= totalPages) {
                currentPage = nuevaPagina;
                renderizarPagina();
            }
        }

        function prepararLista() {
            let filtrados = atletas.filter(a => {
                if (!a.modalidad || !a.modalidad.toLowerCase().includes('race')) return false;
                if (!a.score || a.score.trim() === "") return false; 
                return a.sexo === sexoActual;
            });

            filtrados.sort((a, b) => {
                let sA = scoreToSecondsRace(a.score);
                let sB = scoreToSecondsRace(b.score);
                if (sA !== sB) return sA - sB;
                return a.dorsal.localeCompare(b.dorsal, undefined, { numeric: true });
            });

            filtrados.forEach((a, i) => { a.rankGeneral = i + 1; });
            atletasProcesados = filtrados;
            
            // PÁGINA 1: Toma 15 atletas (Podio completo + 12 dobles). PÁGINAS SIGUIENTES: Toman bloques de 20.
            totalPages = 1 + Math.ceil(Math.max(0, atletasProcesados.length - 15) / 20);
            if (totalPages === 0) totalPages = 1;

            renderizarPagina();
        }

        function renderizarPagina() {
            document.getElementById('ui-page-indicator').innerText = `Pág ${currentPage} de ${totalPages}`;
            document.getElementById('poster-footer-text').innerText = `${currentPage} / ${totalPages}`;

            // Segmentación quirúrgica por página
            let indexInicio = 0;
            let indexFin = 15;
            
            if (currentPage > 1) {
                indexInicio = 15 + (currentPage - 2) * 20;
                indexFin = indexInicio + 20;
            }

            const atletasMostrados = atletasProcesados.slice(indexInicio, indexFin);
            const listaUl = document.getElementById('leaderboard-list');
            listaUl.innerHTML = '';

            atletasMostrados.forEach(atleta => {
                let rankNumber = atleta.rankGeneral;
                let clasePodio = "";
                let contenidoRank = `<span class="rank-number">${rankNumber}</span>`;
                let badgeAbsolutoHTML = "";

                // Cambios visuales de impacto en el Top 3
                if (rankNumber === 1) { 
                    clasePodio = "top-1"; 
                    contenidoRank = `<span class="rank-icon"><i class="fas fa-crown"></i></span>`; 
                    let textoBadge = sexoActual === 'Masculino' ? 'Ganador Absoluto Masculino' : 'Ganadora Absoluta Femenina';
                    badgeAbsolutoHTML = `<div class="absolute-badge"><i class="fas fa-trophy"></i> ${textoBadge}</div>`;
                }
                else if (rankNumber === 2) { clasePodio = "top-2"; }
                else if (rankNumber === 3) { clasePodio = "top-3"; }

                const boxAtleta = atleta.box && atleta.box.trim() !== "" ? atleta.box : 'Independiente';
                const edadAtleta = calcularEdad(atleta.fechaNac);

                const cardDiv = document.createElement('div');
                cardDiv.className = `athlete-card ${clasePodio}`;
                cardDiv.innerHTML = `
                    <div class="card-left">
                        <div class="rank-box">
                            ${contenidoRank}
                        </div>
                        <div class="avatar-box">
                            <img src="${convertirDriveUrl(atleta.foto)}" alt="${atleta.nombre}" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                            <span class="dorsal-tag">#${atleta.dorsal}</span>
                        </div>
                    </div>
                    
                    <div class="card-center">
                        ${badgeAbsolutoHTML}
                        <div class="athlete-name">${atleta.nombre}</div>
                        <div class="athlete-meta">Edad: ${edadAtleta} | Sexo: ${atleta.sexo}</div>
                        <div class="athlete-box"><i class="fas fa-map-marker-alt"></i> ${boxAtleta}</div>
                    </div>
                    
                    <div class="card-right">
                        <div class="time-display">${atleta.score}</div>
                    </div>
                `;
                listaUl.appendChild(cardDiv);
            });
        }

        window.onload = inicializarPoster;
    </script>
</body>
</html>
