<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Oficial | La Ruta Garage</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #d8ff5e; --cf: #ff4444; --bg: #0a0a0a; --card: rgba(20, 20, 20, 0.85); }
        body { 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FbglarutawebsiteBlack.jpg?alt=media&token=8e8d0ddb-b8a4-43f0-8199-98d31beaf078');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; min-height: 100vh;
        }
        
        .header-public { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header-public img { width: 100px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)); }
        .header-public h1 { font-weight: 900; color: white; font-size: 1.5rem; text-transform: uppercase; margin: 0; letter-spacing: 1px; }

        .modality-selector { display: flex; max-width: 900px; margin: 0 auto 25px auto; background: rgba(0,0,0,0.6); border-radius: 12px; padding: 6px; border: 1px solid #333; }
        .mod-btn { flex: 1; padding: 15px; background: transparent; border: none; color: #666; font-family: 'Montserrat'; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .mod-btn.active-race { background: var(--neon); color: black; box-shadow: 0 0 15px rgba(216, 255, 94, 0.3); }
        .mod-btn.active-cf { background: var(--cf); color: white; box-shadow: 0 0 15px rgba(255, 68, 68, 0.4); }

        .controls { max-width: 900px; margin: 0 auto 20px auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 16px; border: 1px solid #222; }
        .filter-group { margin-bottom: 15px; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-label { font-size: 0.65rem; color: #888; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 8px; padding-left: 5px; }
        
        /* CORRECCIÓN: flex-wrap: wrap permite que los botones bajen a la siguiente línea si no caben */
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 6px; }

        .btn-pill { padding: 8px 16px; background: rgba(20,20,20,0.8); color: #aaa; border: 1px solid #333; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; font-family: 'Montserrat'; transition: 0.2s; white-space: nowrap; }
        
        .race-mode .btn-pill.active { background: var(--neon); color: black; border-color: var(--neon); font-weight: 900; }
        .cf-mode .btn-pill.active { background: white; color: black; border-color: white; font-weight: 900; }
        .cf-mode .btn-pill.active-wod { background: var(--cf); color: white; border-color: var(--cf); }

        .leaderboard-container { max-width: 900px; margin: 0 auto 40px auto; background: var(--card); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: rgba(255, 255, 255, 0.03); color: #888; text-align: left; padding: 16px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid #222; }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; font-weight: 400; vertical-align: middle; }
        
        tr.top-1 { background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #ffd700; }
        tr.top-2 { background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #c0c0c0; }
        tr.top-3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #cd7f32; }

        .rank-number { font-weight: 900; font-size: 1.2rem; text-align: center; display: block; width: 30px; color: #fff; }
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); font-size: 1.5rem; }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192,192,192,0.4); font-size: 1.3rem; }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205,127,50,0.4); font-size: 1.2rem; }

        .athlete-profile { display: flex; align-items: center; gap: 12px; }
        .avatar-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #333; background: #222; }
        .top-1 .avatar-img { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .top-2 .avatar-img { border-color: #c0c0c0; }
        .top-3 .avatar-img { border-color: #cd7f32; }
        
        .athlete-details { display: flex; flex-direction: column; align-items: flex-start; }
        .athlete-details strong { font-size: 1rem; color: white; }
        .athlete-details small { color: #aaa; font-size: 0.65rem; text-transform: uppercase; margin-top: 2px; }
        .athlete-box { font-weight: 600; display: flex; align-items: center; gap: 4px; }
        
        /* NUEVO: Etiqueta de Ganador de Heat */
        .winner-heat-badge { background: var(--cf); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.6rem; font-weight: 900; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 10px rgba(255,68,68,0.5); display: inline-block; }

        .race-mode .athlete-box { color: var(--neon); }
        .race-mode .badge-dorsal { color: var(--neon); border: 1px solid rgba(216, 255, 94, 0.2); background: rgba(216, 255, 94, 0.05); }
        .race-mode .score-display { color: var(--neon); }
        
        .cf-mode .athlete-box { color: var(--cf); }
        .cf-mode .badge-dorsal { color: white; border: 1px solid #444; background: #222; }
        .cf-mode .score-display { color: white; }

        .badge-dorsal { padding: 4px 8px; border-radius: 6px; font-weight: 900; font-size: 0.8rem; text-align: center; display: inline-block; }
        .score-display { font-weight: 900; font-size: 1.2rem; text-align: right; display: block; font-family: 'Montserrat', monospace; }
        .points-label { font-size: 0.6rem; color: #888; display: block; text-align: right; text-transform: uppercase; margin-top: -3px; }

        .loader { text-align: center; padding: 30px; font-weight: 900; font-size: 0.9rem; letter-spacing: 2px; color: white; }
    </style>
</head>
<body class="race-mode" id="mainBody">

    <div class="header-public">
        <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FLogo%20Icono%20Verde.png?alt=media&token=07ce2638-9667-4bad-8de1-c38abc5112f8" alt="Logo">
        <h1>TABLA DE POSICIONES</h1>
    </div>

    <div class="modality-selector">
        <button id="btnRace" class="mod-btn active-race" onclick="setModality('Race')"><i class="fas fa-flag-checkered"></i> Ruta Race</button>
        <button id="btnCf" class="mod-btn" onclick="setModality('CrossFit')"><i class="fas fa-dumbbell"></i> Ruta CrossFit</button>
    </div>

    <div id="controls-race" class="controls">
        <div class="filter-group">
            <span class="filter-label">Género</span>
            <div class="filter-row">
                <button class="btn-pill active" id="r-sex-todos" onclick="setFilterRace('sex', 'todos')">Todos</button>
                <button class="btn-pill" id="r-sex-Masculino" onclick="setFilterRace('sex', 'Masculino')">Masculino</button>
                <button class="btn-pill" id="r-sex-Femenino" onclick="setFilterRace('sex', 'Femenino')">Femenino</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">Rango Competitivo</span>
            <div class="filter-row">
                <button class="btn-pill active" id="r-age-todos" onclick="setFilterRace('age', 'todos')">General</button>
                <button class="btn-pill" id="r-age-0-29" onclick="setFilterRace('age', '0-29')">0 - 29</button>
                <button class="btn-pill" id="r-age-30-44" onclick="setFilterRace('age', '30-44')">30 - 44</button>
                <button class="btn-pill" id="r-age-45+" onclick="setFilterRace('age', '45+')">45+</button>
            </div>
        </div>
    </div>

    <div id="controls-cf" class="controls" style="display:none;">
        <div class="filter-group">
            <span class="filter-label">Puntuación / Evento</span>
            <div class="filter-row" id="cf-wods-container">
                <button class="btn-pill active-wod" id="cf-wod-general" onclick="setFilterCF('wod', 'general')"><i class="fas fa-trophy"></i> Overall (Puntos)</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">Categoría</span>
            <div class="filter-row" id="cf-cat-container">
                <button class="btn-pill active" id="cf-cat-todos" onclick="setFilterCF('cat', 'todos')">General</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">Género & Heats</span>
            <div class="filter-row">
                <button class="btn-pill active" id="cf-sex-todos" onclick="setFilterCF('sex', 'todos')">M & F</button>
                <button class="btn-pill" id="cf-sex-Masculino" onclick="setFilterCF('sex', 'Masculino')">Hombres</button>
                <button class="btn-pill" id="cf-sex-Femenino" onclick="setFilterCF('sex', 'Femenino')">Mujeres</button>
            </div>
            <div class="filter-row" id="cf-heat-container" style="margin-top: 10px;">
                <button class="btn-pill active" id="cf-heat-todos" onclick="setFilterCF('heat', 'todos')">Todos los Heats</button>
            </div>
        </div>
    </div>

    <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Sincronizando Base de Datos...</div>

    <div class="leaderboard-container">
        <div class="table-wrapper">
            <table>
                <thead id="tablaHead"></thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hzywpjzvlvdxscgtebvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6eXdwanp2bHZkeHNjZ3RlYnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjI0OTQsImV4cCI6MjA5NDYzODQ5NH0.L7gdDpxOD7N1gpSoCVI0FEiwxR44sG8XwAORYm16sEM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let atletas = [];
        let wodsCF = [];
        let modalidadActual = 'Race';
        let filtrosRace = { sex: 'todos', age: 'todos' };
        let filtrosCF = { wod: 'general', cat: 'todos', sex: 'todos', heat: 'todos' };

        async function inicializar() {
            const { data: dataWods } = await supabaseClient.from('wods_cf').select('*').order('id', { ascending: true });
            if(dataWods) wodsCF = dataWods;
            renderizarBotonesWodsCF();

            const { data: dataAtletas } = await supabaseClient.from('atletas').select('*');
            if(dataAtletas) atletas = dataAtletas;
            
            document.getElementById('loader').style.display = 'none';
            renderizarFiltrosDinamicosCF();
            procesarYRenderizar();

            supabaseClient.channel('public-leaderboard')
                .on('postgres_changes', { event: 'UPDATE', scheme: 'public', table: 'atletas' }, payload => {
                    let idx = atletas.findIndex(a => a.id === payload.new.id);
                    if (idx !== -1) atletas[idx] = payload.new;
                    else atletas.push(payload.new);
                    procesarYRenderizar();
                })
                .on('postgres_changes', { event: '*', scheme: 'public', table: 'wods_cf' }, async payload => {
                    const { data } = await supabaseClient.from('wods_cf').select('*').order('id', { ascending: true });
                    if(data) { wodsCF = data; renderizarBotonesWodsCF(); procesarYRenderizar(); }
                })
                .subscribe();
        }

        function setModality(mod) {
            modalidadActual = mod;
            let body = document.getElementById('mainBody');
            
            if(mod === 'Race') {
                document.getElementById('btnRace').classList.add('active-race');
                document.getElementById('btnCf').classList.remove('active-cf');
                document.getElementById('controls-race').style.display = 'block';
                document.getElementById('controls-cf').style.display = 'none';
                body.className = 'race-mode';
            } else {
                document.getElementById('btnRace').classList.remove('active-race');
                document.getElementById('btnCf').classList.add('active-cf');
                document.getElementById('controls-race').style.display = 'none';
                document.getElementById('controls-cf').style.display = 'block';
                body.className = 'cf-mode';
            }
            procesarYRenderizar();
        }

        function convertirDriveUrl(url) {
            if (!url || url.trim() === "") return "https://ui-avatars.com/api/?name=Atleta&background=222&color=fff";
            let match = url.match(/\/d\/(.*?)\//);
            return match && match[1] ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w150-h150` : url;
        }

        function calcularEdad(fechaNacStr) {
            if (!fechaNacStr) return 'N/A';
            let nacimiento = new Date(fechaNacStr);
            if (isNaN(nacimiento.getTime())) return 'N/A';
            let hoy = new Date();
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            let m = hoy.getMonth() - nacimiento.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) { edad--; }
            return edad;
        }

        // ================= Race =================
        function setFilterRace(tipo, valor) {
            filtrosRace[tipo] = valor;
            document.querySelectorAll(`[id^="r-${tipo}-"]`).forEach(b => b.classList.remove('active'));
            document.getElementById(`r-${tipo}-${valor}`).classList.add('active');
            procesarYRenderizar();
        }

        function scoreToSecondsRace(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "" || scoreStr.toLowerCase() === "dns" || scoreStr.toLowerCase() === "dnf") return Infinity;
            let partes = scoreStr.split(':');
            if (partes.length === 2) return (parseInt(partes[0]) || 0) * 60 + parseFloat(partes[1] || 0);
            let num = parseFloat(scoreStr);
            return isNaN(num) ? Infinity : num;
        }

        function renderizarRace() {
            let filtrados = atletas.filter(a => {
                if (!a.modalidad || !a.modalidad.toLowerCase().includes('race')) return false;
                if (filtrosRace.sex !== 'todos' && a.sexo !== filtrosRace.sex) return false;
                
                let edad = calcularEdad(a.fechaNac);
                if (filtrosRace.age !== 'todos') {
                    if (edad === 'N/A') return false;
                    if (filtrosRace.age === '0-29' && edad > 29) return false;
                    if (filtrosRace.age === '30-44' && (edad < 30 || edad > 44)) return false;
                    if (filtrosRace.age === '45+' && edad < 45) return false;
                }
                return true;
            });

            filtrados.sort((a, b) => scoreToSecondsRace(a.score) - scoreToSecondsRace(b.score));

            document.getElementById('tablaHead').innerHTML = `
                <tr>
                    <th style="width: 50px; text-align: center;">Pos</th>
                    <th>Atleta / Box</th>
                    <th style="width: 70px; text-align: center;">Dorsal</th>
                    <th style="text-align: right; padding-right: 25px;">Tiempo Race</th>
                </tr>
            `;

            dibujarFilas(filtrados, (a, isTop) => {
                let scoreText = a.score || '--:--';
                return `<td style="padding-right: 25px;"><span class="score-display" style="${isTop ? 'color:#ffd700;' : ''}">${scoreText}</span></td>`;
            }, false, false, null); // false = use visual rank, false = no ganador heat
        }

        // ================= CF =================
        function setFilterCF(tipo, valor) {
            filtrosCF[tipo] = valor;
            document.querySelectorAll(`[id^="cf-${tipo}-"]`).forEach(b => {
                b.classList.remove('active');
                if(tipo === 'wod') b.classList.remove('active-wod');
            });
            let btn = document.getElementById(`cf-${tipo}-${valor}`);
            if(btn) {
                btn.classList.add('active');
                if(tipo === 'wod') btn.classList.add('active-wod');
            }
            procesarYRenderizar();
        }

        function renderizarBotonesWodsCF() {
            let container = document.getElementById('cf-wods-container');
            let html = `<button class="btn-pill active-wod" id="cf-wod-general" onclick="setFilterCF('wod', 'general')"><i class="fas fa-trophy"></i> Overall (Puntos)</button>`;
            wodsCF.forEach(w => {
                html += `<button class="btn-pill" id="cf-wod-${w.id}" onclick="setFilterCF('wod', '${w.id}')">${w.nombre}</button>`;
            });
            container.innerHTML = html;
        }

        function renderizarFiltrosDinamicosCF() {
            let cats = new Set(); let heats = new Set();
            atletas.forEach(a => {
                if(a.modalidad && a.modalidad.toLowerCase().includes('crossfit')) {
                    if(a.categoria) cats.add(a.categoria);
                    if(a.heat && a.heat !== 'Sin Asignar') heats.add(a.heat);
                }
            });
            
            let htmlCat = `<button class="btn-pill active" id="cf-cat-todos" onclick="setFilterCF('cat', 'todos')">General</button>`;
            Array.from(cats).sort().forEach(c => htmlCat += `<button class="btn-pill" id="cf-cat-${c.replace(/\s+/g, '')}" onclick="setFilterCF('cat', '${c}')">${c}</button>`);
            document.getElementById('cf-cat-container').innerHTML = htmlCat;

            let htmlHeat = `<button class="btn-pill active" id="cf-heat-todos" onclick="setFilterCF('heat', 'todos')">Todos los Heats</button>`;
            Array.from(heats).sort((a,b)=>a-b).forEach(h => htmlHeat += `<button class="btn-pill" id="cf-heat-${h}" onclick="setFilterCF('heat', '${h}')">Heat ${h}</button>`);
            document.getElementById('cf-heat-container').innerHTML = htmlHeat;
        }

        function parseScoreCF(scoreStr, isTime) {
            if (!scoreStr || scoreStr.trim() === "" || scoreStr.toLowerCase() === "dns" || scoreStr.toLowerCase() === "dnf") return isTime ? Infinity : -Infinity;
            if (isTime) {
                let partes = scoreStr.split(':');
                if (partes.length === 2) return (parseInt(partes[0]) || 0) * 60 + parseFloat(partes[1] || 0);
                let num = parseFloat(scoreStr); return isNaN(num) ? Infinity : num;
            } else {
                let num = parseFloat(scoreStr); return isNaN(num) ? -Infinity : num;
            }
        }

        function calcularPuntosOverallCF(atletasBase) {
            atletasBase.forEach(a => { a.tempTotalPts = 0; a.tempWodRanks = {}; });
            wodsCF.forEach(wod => {
                let isTime = wod.tipo && wod.tipo.toLowerCase().includes('time');
                let arrayWod = atletasBase.map(a => {
                    let wData = a.wods_data || {};
                    return { id: a.id, val: parseScoreCF((wData[wod.id] || {}).score, isTime) };
                });
                arrayWod.sort((a, b) => isTime ? a.val - b.val : b.val - a.val);

                let currentRank = 1;
                for (let i = 0; i < arrayWod.length; i++) {
                    if (i > 0 && arrayWod[i].val !== arrayWod[i-1].val) currentRank = i + 1;
                    let pts = (arrayWod[i].val === (isTime ? Infinity : -Infinity)) ? atletasBase.length + 1 : currentRank;
                    let atletaObj = atletasBase.find(a => a.id === arrayWod[i].id);
                    atletaObj.tempTotalPts += pts;
                    atletaObj.tempWodRanks[wod.id] = pts;
                }
            });
        }

        function renderizarCF() {
            let competidores = atletas.filter(a => {
                if (!a.modalidad || !a.modalidad.toLowerCase().includes('crossfit')) return false;
                if (filtrosCF.cat !== 'todos' && a.categoria !== filtrosCF.cat) return false;
                if (filtrosCF.sex !== 'todos' && a.sexo !== filtrosCF.sex) return false;
                return true;
            });

            if (filtrosCF.wod === 'general') {
                calcularPuntosOverallCF(competidores);
                competidores.sort((a, b) => a.tempTotalPts - b.tempTotalPts);
                document.getElementById('tablaHead').innerHTML = `
                    <tr>
                        <th style="width: 50px; text-align: center;">Pos</th>
                        <th>Atleta / Box</th>
                        <th style="width: 70px; text-align: center;">Dorsal</th>
                        <th style="text-align: right; padding-right: 25px;">Pts Totales</th>
                    </tr>
                `;
            } else {
                let wodActual = wodsCF.find(w => w.id == filtrosCF.wod);
                let isTime = wodActual && wodActual.tipo && wodActual.tipo.toLowerCase().includes('time');
                
                competidores.sort((a, b) => {
                    let vA = parseScoreCF(((a.wods_data||{})[filtrosCF.wod]||{}).score, isTime);
                    let vB = parseScoreCF(((b.wods_data||{})[filtrosCF.wod]||{}).score, isTime);
                    return isTime ? vA - vB : vB - vA;
                });

                document.getElementById('tablaHead').innerHTML = `
                    <tr>
                        <th style="width: 50px; text-align: center;">Pos</th>
                        <th>Atleta / Box</th>
                        <th style="width: 70px; text-align: center;">Dorsal</th>
                        <th style="text-align: right; padding-right: 25px;">Score Evento</th>
                    </tr>
                `;
            }

            competidores.forEach((a, idx) => a.tempGlobalRank = idx + 1);

            let aMostrar = competidores.filter(a => {
                if (filtrosCF.heat !== 'todos' && (a.heat || 'Sin Asignar') !== filtrosCF.heat) return false;
                return true;
            });

            // Lógica para detectar si hay que mostrar el "Ganador del Heat"
            let mostrarGanadorHeat = (filtrosCF.wod !== 'general' && filtrosCF.heat !== 'todos');

            dibujarFilas(aMostrar, (a, isTop) => {
                if(filtrosCF.wod === 'general') {
                    let text = a.tempTotalPts > 0 ? a.tempTotalPts : '--';
                    return `<td style="padding-right: 25px; text-align:right;">
                                <span class="score-display" style="${isTop ? 'color:white;' : ''}">${text}</span>
                                <span class="points-label">PUNTOS</span>
                            </td>`;
                } else {
                    let s1 = ((a.wods_data||{})[filtrosCF.wod]||{}).score;
                    let text1 = (s1 && s1.trim() !== "") ? s1 : '--';
                    let s2 = ((a.wods_data||{})[filtrosCF.wod]||{}).score2;
                    let out = `<span class="score-display" style="${isTop ? 'color:white;' : ''}">${text1}</span>`;
                    if(s2) out += `<span class="points-label">TB: ${s2}</span>`;
                    return `<td style="padding-right: 25px; text-align:right;">${out}</td>`;
                }
            }, true, mostrarGanadorHeat, filtrosCF.wod);
        }

        // ================= DIBUJAR =================
        function procesarYRenderizar() {
            if(modalidadActual === 'Race') renderizarRace();
            else renderizarCF();
        }

        function dibujarFilas(array, funcScoreHTML, useTempRank = false, mostrarGanadorHeat = false, wodIdStr = null) {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if(array.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px; color:#666;">No se encontraron resultados para este filtro.</td></tr>';
                return;
            }

            array.forEach((atleta, visualIndex) => {
                let rankNumber = useTempRank ? atleta.tempGlobalRank : (visualIndex + 1);
                let claseRank = ""; let contenidoRank = rankNumber; let claseRow = "";
                let isTop = rankNumber <= 3;

                if (rankNumber === 1) { claseRank = "rank-1"; contenidoRank = `<i class="fas fa-crown"></i>`; claseRow = "top-1"; }
                else if (rankNumber === 2) { claseRank = "rank-2"; contenidoRank = `2`; claseRow = "top-2"; }
                else if (rankNumber === 3) { claseRank = "rank-3"; contenidoRank = `3`; claseRow = "top-3"; }

                // Lógica de Medalla de Ganador de Heat
                let badgeHeat = "";
                if (mostrarGanadorHeat && visualIndex === 0) {
                    let tieneS = false;
                    if(modalidadActual !== 'Race') {
                         let s = ((atleta.wods_data||{})[wodIdStr]||{}).score;
                         tieneS = s && s.trim() !== "";
                    }
                    if(tieneS) {
                        badgeHeat = `<span class="winner-heat-badge"><i class="fas fa-fire"></i> Ganador de Heat</span>`;
                    }
                }

                let tr = document.createElement('tr');
                tr.className = claseRow;
                
                tr.innerHTML = `
                    <td style="display: flex; justify-content: center; align-items: center; height: 60px;">
                        <span class="rank-number ${claseRank}">${contenidoRank}</span>
                    </td>
                    <td>
                        <div class="athlete-profile">
                            <img src="${convertirDriveUrl(atleta.foto)}" alt="Avatar" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                            <div class="athlete-details">
                                <strong>${atleta.nombre}</strong>
                                <small>${atleta.categoria}</small>
                                <small class="athlete-box"><i class="fas fa-map-marker-alt"></i> ${atleta.box || 'Independiente'}</small>
                                ${badgeHeat}
                            </div>
                        </div>
                    </td>
                    <td style="text-align: center;"><span class="badge-dorsal">#${atleta.dorsal}</span></td>
                    ${funcScoreHTML(atleta, isTop)}
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = inicializar;
    </script>
</body>
</html>
