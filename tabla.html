<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Oficial | La Ruta Garage</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #d8ff5e; --cf: #ff4444; --bg: #0a0a0a; --card: rgba(20, 20, 20, 0.85); }
        body { 
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FbglarutawebsiteBlack.jpg?alt=media&token=8e8d0ddb-b8a4-43f0-8199-98d31beaf078');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: white; font-family: 'Montserrat', sans-serif; margin: 0; padding: 15px; min-height: 100vh;
        }
        
        .header-public { text-align: center; margin-bottom: 20px; padding-top: 10px; }
        .header-public img { width: 100px; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)); }
        .header-public h1 { font-weight: 900; color: white; font-size: 1.5rem; text-transform: uppercase; margin: 0; letter-spacing: 1px; }

        /* Selector de Modalidad */
        .modality-selector { display: flex; max-width: 900px; margin: 0 auto 25px auto; background: rgba(0,0,0,0.6); border-radius: 12px; padding: 6px; border: 1px solid #333; }
        .mod-btn { flex: 1; padding: 15px; background: transparent; border: none; color: #666; font-family: 'Montserrat'; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .mod-btn.active-race { background: var(--neon); color: black; box-shadow: 0 0 15px rgba(216, 255, 94, 0.3); }
        .mod-btn.active-cf { background: var(--cf); color: white; box-shadow: 0 0 15px rgba(255, 68, 68, 0.4); }

        .controls { max-width: 900px; margin: 0 auto 20px auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 16px; border: 1px solid #222; }
        .filter-group { margin-bottom: 15px; }
        .filter-group:last-child { margin-bottom: 0; }
        .filter-label { font-size: 0.65rem; color: #cfcfcf; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 8px; padding-left: 5px; }
        .filter-row { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 6px; }

        .btn-pill { padding: 8px 16px; background: rgba(20,20,20,0.8); color: #aaa; border: 1px solid #333; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; font-family: 'Montserrat'; transition: 0.2s; white-space: nowrap; }
        
        .race-mode .btn-pill.active { background: var(--neon); color: black; border-color: var(--neon); font-weight: 900; }
        .cf-mode .btn-pill.active { background: white; color: black; border-color: white; font-weight: 900; }
        .cf-mode .btn-pill.active-wod { background: var(--cf); color: white; border-color: var(--cf); }

        .leaderboard-container { max-width: 900px; margin: 0 auto 40px auto; background: var(--card); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: rgba(255, 255, 255, 0.03); color: #888; text-align: left; padding: 16px; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; border-bottom: 2px solid #222; }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 0.9rem; font-weight: 400; vertical-align: middle; }
        
        tr.top-1 { background: linear-gradient(90deg, rgba(255, 215, 0, 0.15) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #ffd700; }
        tr.top-2 { background: linear-gradient(90deg, rgba(192, 192, 192, 0.1) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #c0c0c0; }
        tr.top-3 { background: linear-gradient(90deg, rgba(205, 127, 50, 0.1) 0%, rgba(0,0,0,0) 100%); border-left: 4px solid #cd7f32; }

        .rank-number { font-weight: 900; font-size: 1.2rem; text-align: center; display: block; width: 30px; color: #fff; }
        .rank-1 { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.6); font-size: 1.5rem; }
        .rank-2 { color: #c0c0c0; text-shadow: 0 0 10px rgba(192,192,192,0.4); font-size: 1.3rem; }
        .rank-3 { color: #cd7f32; text-shadow: 0 0 10px rgba(205,127,50,0.4); font-size: 1.2rem; }

        .athlete-profile { display: flex; align-items: center; gap: 12px; }
        .avatar-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #333; background: #222; }
        .top-1 .avatar-img { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.4); }
        .top-2 .avatar-img { border-color: #c0c0c0; }
        .top-3 .avatar-img { border-color: #cd7f32; }
        
        .athlete-details { display: flex; flex-direction: column; align-items: flex-start; }
        .athlete-details strong { font-size: 1rem; color: white; }
        .athlete-details small { color: #aaa; font-size: 0.65rem; text-transform: uppercase; margin-top: 2px; }
        
        .race-mode .badge-dorsal { color: var(--neon); border: 1px solid rgba(216, 255, 94, 0.2); background: rgba(216, 255, 94, 0.05); }
        .race-mode .score-display { color: var(--neon); }
        
        .cf-mode .badge-dorsal { color: white; border: 1px solid #444; background: #222; }
        .cf-mode .score-display { color: white; }

        .badge-dorsal { padding: 4px 8px; border-radius: 6px; font-weight: 900; font-size: 0.8rem; text-align: center; display: inline-block; }
        .score-display { font-weight: 900; font-size: 1.2rem; display: block; font-family: 'Montserrat', monospace; text-align: right; }
        .points-wod { color: var(--cf); font-weight: 900; font-size: 0.9rem; text-align: right; margin-top: 2px; }
        .total-acumulado { font-size: 1.3rem; font-weight: 900; color: #d8ff5e; text-shadow: 0 0 10px rgba(216, 255, 94, 0.3); display: block; }

        .loader { text-align: center; padding: 40px; font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; color: #888; }
        .locked-msg { text-align: center; padding: 50px 20px; }
        .locked-msg i { font-size: 3rem; color: var(--cf); margin-bottom: 15px; }
        .locked-msg h3 { margin: 0; font-size: 1.5rem; color: white; }
        .locked-msg p { color: #888; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body class="cf-mode" id="mainBody">

    <div class="header-public">
        <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FLogo%20Icono%20Verde.png?alt=media&token=07ce2638-9667-4bad-8de1-c38abc5112f8" alt="Logo">
        <h1>TABLA DE POSICIONES</h1>
    </div>

    <div class="modality-selector">
        <button id="btnCf" class="mod-btn active-cf" onclick="setModality('CrossFit')"><i class="fas fa-dumbbell"></i> Ruta CrossFit</button>
        <button id="btnRace" class="mod-btn" onclick="setModality('Race')"><i class="fas fa-flag-checkered"></i> Ruta Race</button>
    </div>

    <div id="controls-cf" class="controls">
        <div class="filter-group">
            <span class="filter-label">1. Selecciona el Evento (WOD)</span>
            <div class="filter-row" id="cf-wods-container"></div>
        </div>
        <div class="filter-group">
            <span class="filter-label">2. Selecciona la Categoría</span>
            <div class="filter-row" id="cf-cat-container"></div>
        </div>
        <div class="filter-group">
            <span class="filter-label">3. Selecciona el Género</span>
            <div class="filter-row">
                <button class="btn-pill" id="cf-sex-Masculino" onclick="setFilterCF('sex', 'Masculino')">Hombres</button>
                <button class="btn-pill" id="cf-sex-Femenino" onclick="setFilterCF('sex', 'Femenino')">Mujeres</button>
            </div>
        </div>
    </div>

    <div id="controls-race" class="controls" style="display:none;">
        <div class="filter-group">
            <span class="filter-label">Género</span>
            <div class="filter-row">
                <button class="btn-pill active" id="r-sex-todos" onclick="setFilterRace('sex', 'todos')">Todos</button>
                <button class="btn-pill" id="r-sex-Masculino" onclick="setFilterRace('sex', 'Masculino')">Hombres</button>
                <button class="btn-pill" id="r-sex-Femenino" onclick="setFilterRace('sex', 'Femenino')">Mujeres</button>
            </div>
        </div>
        <div class="filter-group">
            <span class="filter-label">Rango Competitivo (Edad)</span>
            <div class="filter-row">
                <button class="btn-pill active" id="r-age-todos" onclick="setFilterRace('age', 'todos')">General</button>
                <button class="btn-pill" id="r-age-0-29" onclick="setFilterRace('age', '0-29')">0 - 29</button>
                <button class="btn-pill" id="r-age-30-44" onclick="setFilterRace('age', '30-44')">30 - 44</button>
                <button class="btn-pill" id="r-age-45+" onclick="setFilterRace('age', '45+')">45+</button>
            </div>
        </div>
    </div>

    <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Cargando Base de Datos...</div>
    
    <div id="leaderboard-area" class="leaderboard-container" style="display:none;">
        <div class="table-wrapper">
            <table>
                <thead id="tablaHead"></thead>
                <tbody id="tablaCuerpo"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hzywpjzvlvdxscgtebvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6eXdwanp2bHZkeHNjZ3RlYnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjI0OTQsImV4cCI6MjA5NDYzODQ5NH0.L7gdDpxOD7N1gpSoCVI0FEiwxR44sG8XwAORYm16sEM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let atletas = [];
        let wodsCF = [];
        let modalidadActual = 'CrossFit'; 
        let filtrosCF = { wod: null, cat: null, sex: null };
        let filtrosRace = { sex: 'todos', age: 'todos' };

        async function inicializar() {
            // Cargar WODs
            const { data: dataWods } = await supabaseClient.from('wods_cf').select('*').order('id', { ascending: true });
            if(dataWods) {
                wodsCF = dataWods;
                // SELECCIONA "OVERALL" POR DEFECTO AL CARGAR
                if(wodsCF.length > 0) filtrosCF.wod = 'overall'; 
            }
            renderizarBotonesWodsCF();

            // Cargar TODOS los Atletas
            const { data: dataAtletas } = await supabaseClient.from('atletas').select('*');
            if(dataAtletas) atletas = dataAtletas;
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('leaderboard-area').style.display = 'block';
            renderizarFiltrosDinamicosCF();
            procesarYRenderizar();

            // REALTIME
            supabaseClient.channel('public-leaderboard')
                .on('postgres_changes', { event: 'UPDATE', scheme: 'public', table: 'atletas' }, payload => {
                    let idx = atletas.findIndex(a => a.id === payload.new.id);
                    if (idx !== -1) atletas[idx] = payload.new;
                    else atletas.push(payload.new);
                    procesarYRenderizar();
                })
                .on('postgres_changes', { event: '*', scheme: 'public', table: 'wods_cf' }, async payload => {
                    const { data } = await supabaseClient.from('wods_cf').select('*').order('id', { ascending: true });
                    if(data) { wodsCF = data; renderizarBotonesWodsCF(); procesarYRenderizar(); }
                }).subscribe();
        }

        function setModality(mod) {
            modalidadActual = mod;
            let body = document.getElementById('mainBody');
            
            if(mod === 'Race') {
                document.getElementById('btnRace').classList.add('active-race');
                document.getElementById('btnCf').classList.remove('active-cf');
                document.getElementById('controls-race').style.display = 'block';
                document.getElementById('controls-cf').style.display = 'none';
                body.className = 'race-mode';
            } else {
                document.getElementById('btnRace').classList.remove('active-race');
                document.getElementById('btnCf').classList.add('active-cf');
                document.getElementById('controls-race').style.display = 'none';
                document.getElementById('controls-cf').style.display = 'block';
                body.className = 'cf-mode';
            }
            procesarYRenderizar();
        }

        function convertirDriveUrl(url) {
            if (!url || url.trim() === "") return "https://ui-avatars.com/api/?name=CF&background=222&color=fff";
            let match = url.match(/\/d\/(.*?)\//);
            return match && match[1] ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w150-h150` : url;
        }

        function calcularEdad(fechaNacStr) {
            if (!fechaNacStr) return 'N/A';
            let nacimiento = new Date(fechaNacStr);
            if (isNaN(nacimiento.getTime())) return 'N/A';
            let hoy = new Date();
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            let m = hoy.getMonth() - nacimiento.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) { edad--; }
            return edad;
        }

        // --- RUTA RACE ---
        function setFilterRace(tipo, valor) {
            filtrosRace[tipo] = valor;
            document.querySelectorAll(`[id^="r-${tipo}-"]`).forEach(b => b.classList.remove('active'));
            document.getElementById(`r-${tipo}-${valor}`).classList.add('active');
            procesarYRenderizar();
        }

        function scoreToSecondsRace(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "") return Infinity;
            let partes = scoreStr.split(':');
            if (partes.length === 2) return (parseInt(partes[0]) || 0) * 60 + parseFloat(partes[1] || 0);
            let num = parseFloat(scoreStr);
            return isNaN(num) ? Infinity : num;
        }

        function procesarRace() {
            let filtrados = atletas.filter(a => {
                if (!a.modalidad || !a.modalidad.toLowerCase().includes('race')) return false;
                if (filtrosRace.sex !== 'todos' && a.sexo !== filtrosRace.sex) return false;
                
                let edad = calcularEdad(a.fechaNac);
                if (filtrosRace.age !== 'todos') {
                    if (edad === 'N/A') return false;
                    if (filtrosRace.age === '0-29' && edad > 29) return false;
                    if (filtrosRace.age === '30-44' && (edad < 30 || edad > 44)) return false;
                    if (filtrosRace.age === '45+' && edad < 45) return false;
                }
                return true;
            });

            filtrados.sort((a, b) => {
                let sA = scoreToSecondsRace(a.score);
                let sB = scoreToSecondsRace(b.score);
                if (sA !== sB) return sA - sB;
                return a.dorsal.localeCompare(b.dorsal, undefined, { numeric: true });
            });

            document.getElementById('tablaHead').innerHTML = `
                <tr>
                    <th style="width: 50px; text-align: center;">Pos</th>
                    <th>Atleta / Box</th>
                    <th style="width: 70px; text-align: center;">Dorsal</th>
                    <th style="text-align: right; padding-right: 25px;">Tiempo (Race)</th>
                </tr>
            `;

            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            if (filtrados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#666;">No se encontraron competidores en esta categoría.</td></tr>';
                return;
            }

            filtrados.forEach((atleta, index) => {
                let tieneScore = atleta.score && atleta.score.trim() !== "";
                let rankNumber = tieneScore ? (index + 1) : '-';
                
                let claseRank = ""; let contenidoRank = rankNumber; let claseRow = "";
                let isTop = rankNumber <= 3 && tieneScore;

                if (rankNumber === 1) { claseRank = "rank-1"; contenidoRank = `<i class="fas fa-crown"></i>`; claseRow = "top-1"; }
                else if (rankNumber === 2) { claseRank = "rank-2"; contenidoRank = `2`; claseRow = "top-2"; }
                else if (rankNumber === 3) { claseRank = "rank-3"; contenidoRank = `3`; claseRow = "top-3"; }

                let scoreText = tieneScore ? atleta.score : '--:--';
                let notasHTML = atleta.notas ? `<br><small style="color:#cfcfcf; font-size:0.6rem;">${atleta.notas}</small>` : '';

                let tr = document.createElement('tr');
                tr.className = claseRow;
                tr.innerHTML = `
                    <td style="display: flex; justify-content: center; align-items: center; height: 60px;">
                        <span class="rank-number ${claseRank}">${contenidoRank}</span>
                    </td>
                    <td>
                        <div class="athlete-profile">
                            <img src="${convertirDriveUrl(atleta.foto)}" alt="Avatar" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                            <div class="athlete-details">
                                <strong>${atleta.nombre}</strong>
                                <small>Edad: ${calcularEdad(atleta.fechaNac)} | ${atleta.sexo}</small>
                            </div>
                        </div>
                    </td>
                    <td style="text-align: center;"><span class="badge-dorsal">#${atleta.dorsal}</span></td>
                    <td style="text-align: right; padding-right: 25px;">
                        <span class="score-display" style="${isTop ? 'color: var(--neon);' : ''}">${scoreText}</span>
                        ${notasHTML}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- CONTROLADORES DE CROSSFIT ---
        function setFilterCF(tipo, valor) {
            filtrosCF[tipo] = valor;
            document.querySelectorAll(`[id^="cf-${tipo}-"]`).forEach(b => {
                b.classList.remove('active');
                if(tipo === 'wod') b.classList.remove('active-wod');
            });
            let btn = document.getElementById(`cf-${tipo}-${valor}`);
            if(btn) {
                btn.classList.add('active');
                if(tipo === 'wod') btn.classList.add('active-wod');
            }
            procesarYRenderizar();
        }

        function renderizarBotonesWodsCF() {
            let html = '';
            
            // NUEVO BOTÓN DE TABLA GENERAL (OVERALL)
            let actOverall = (filtrosCF.wod === 'overall') ? 'active-wod' : '';
            html += `<button class="btn-pill ${actOverall}" id="cf-wod-overall" onclick="setFilterCF('wod', 'overall')"><i class="fas fa-trophy"></i> TABLA GENERAL</button>`;

            wodsCF.forEach(w => {
                let act = (w.id == filtrosCF.wod) ? 'active-wod' : '';
                html += `<button class="btn-pill ${act}" id="cf-wod-${w.id}" onclick="setFilterCF('wod', '${w.id}')">${w.nombre}</button>`;
            });
            document.getElementById('cf-wods-container').innerHTML = html;
        }

        function renderizarFiltrosDinamicosCF() {
            let cats = new Set();
            atletas.forEach(a => { if(a.categoria && a.modalidad && a.modalidad.toLowerCase().includes('crossfit')) cats.add(a.categoria); });
            
            let htmlCat = '';
            Array.from(cats).sort().forEach(c => {
                let act = (c === filtrosCF.cat) ? 'active' : '';
                htmlCat += `<button class="btn-pill ${act}" id="cf-cat-${c.replace(/\s+/g, '')}" onclick="setFilterCF('cat', '${c}')">${c}</button>`;
            });
            document.getElementById('cf-cat-container').innerHTML = htmlCat;
        }

        function parseScoreCF(s, isTime) {
            if (!s || s.trim() === "") return isTime ? Infinity : -Infinity;
            if (s.includes('+')) {
                let parts = s.split('+');
                let val = (parseInt(parts[0]) || 0) * 10000 + (parseInt(parts[1]) || 0);
                return isTime ? 1000000 - val : val;
            }
            if (s.includes(':')) {
                let parts = s.split(':');
                return (parseInt(parts[0]) || 0) * 60 + parseFloat(parts[1] || 0);
            }
            return parseFloat(s) || (isTime ? Infinity : -Infinity);
        }

        function procesarCF() {
            const tbody = document.getElementById('tablaCuerpo');
            const thead = document.getElementById('tablaHead');
            
            if(!filtrosCF.cat || !filtrosCF.sex || !filtrosCF.wod) {
                tbody.innerHTML = `<tr><td colspan="5"><div class="locked-msg"><i class="fas fa-hand-pointer"></i><h3>Selecciona Categoría, Género y Evento</h3><p>Para ver los resultados oficiales de la competencia.</p></div></td></tr>`;
                thead.innerHTML = '';
                return;
            }

            let keyCheck = `${filtrosCF.cat}_${filtrosCF.sex}`;
            let isOverall = (filtrosCF.wod === 'overall');

            // Si es un WOD específico, verificamos que el administrador lo haya publicado
            if (!isOverall) {
                let wodActualObj = wodsCF.find(w => w.id == filtrosCF.wod);
                let isPublished = wodActualObj?.publicados?.[keyCheck] === true;

                if(!isPublished) {
                    tbody.innerHTML = `<tr><td colspan="5"><div class="locked-msg"><i class="fas fa-lock"></i><h3>Resultados en Validación</h3><p>Los jueces están cerrando los heats. Los resultados aparecerán pronto.</p></div></td></tr>`;
                    thead.innerHTML = '';
                    return;
                }
            }

            // Cálculos Maestros (Siempre calculamos los puntos para tener el Total General)
            atletas.forEach(a => {
                a.totalPts = 0;
                a.wodPtsData = {}; 
                a.tieneScoreWod = {};
            });

            wodsCF.forEach(wod => {
                let isTime = wod.tipo?.toLowerCase().includes('time');
                let isWodPublished = wod.publicados?.[keyCheck] === true;
                
                let filtradosCat = atletas.filter(a => a.categoria === filtrosCF.cat && a.sexo === filtrosCF.sex && a.modalidad && a.modalidad.toLowerCase().includes('crossfit'));
                let parseados = filtradosCat.map(a => {
                    let s = a.wods_data?.[wod.id]?.score || "";
                    return { id: a.id, val: parseScoreCF(s, isTime), tiene: s.trim() !== "" };
                });

                let conScore = parseados.filter(g => g.tiene);
                conScore.sort((a,b) => isTime ? a.val - b.val : b.val - a.val);

                let rank = 1;
                for(let i=0; i<conScore.length; i++) {
                    if(i > 0 && conScore[i].val !== conScore[i-1].val) rank = i+1;
                    let pts = Math.max(100 - ((rank - 1) * 5), 0);

                    let atletaRef = atletas.find(x => x.id === conScore[i].id);
                    if(atletaRef) {
                        atletaRef.wodPtsData[wod.id] = pts;
                        atletaRef.tieneScoreWod[wod.id] = true;
                        // OJO: Los puntos solo suman al Overall si el WOD está "Publicado" por el juez
                        if(isWodPublished) atletaRef.totalPts += pts;
                    }
                }
            });

            let aMostrar = atletas.filter(a => a.categoria === filtrosCF.cat && a.sexo === filtrosCF.sex && a.modalidad && a.modalidad.toLowerCase().includes('crossfit'));

            if (isOverall) {
                // ORDENAMIENTO Y DIBUJO DE LA TABLA GENERAL
                aMostrar.sort((a, b) => {
                    if(b.totalPts !== a.totalPts) return b.totalPts - a.totalPts; 
                    return a.dorsal.localeCompare(b.dorsal, undefined, { numeric: true });
                });

                thead.innerHTML = `
                    <tr>
                        <th style="width: 50px; text-align: center;">Pos</th>
                        <th>Atleta / Box</th>
                        <th style="width: 70px; text-align: center;">Dorsal</th>
                        <th style="text-align: right; padding-right: 25px;">Puntos Totales</th>
                    </tr>
                `;

                tbody.innerHTML = '';
                if (aMostrar.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#666;">No se encontraron competidores en esta categoría.</td></tr>';
                    return;
                }

                aMostrar.forEach((atleta, index) => {
                    let rankNumber = index + 1;
                    let claseRank = ""; let contenidoRank = rankNumber; let claseRow = "";
                    let isTop = rankNumber <= 3 && atleta.totalPts > 0;

                    if (rankNumber === 1 && atleta.totalPts > 0) { claseRank = "rank-1"; contenidoRank = `<i class="fas fa-crown"></i>`; claseRow = "top-1"; }
                    else if (rankNumber === 2 && atleta.totalPts > 0) { claseRank = "rank-2"; contenidoRank = `2`; claseRow = "top-2"; }
                    else if (rankNumber === 3 && atleta.totalPts > 0) { claseRank = "rank-3"; contenidoRank = `3`; claseRow = "top-3"; }

                    let tr = document.createElement('tr');
                    tr.className = claseRow;
                    tr.innerHTML = `
                        <td style="display: flex; justify-content: center; align-items: center; height: 60px;">
                            <span class="rank-number ${claseRank}">${contenidoRank}</span>
                        </td>
                        <td>
                            <div class="athlete-profile">
                                <img src="${convertirDriveUrl(atleta.foto)}" alt="Avatar" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                                <div class="athlete-details">
                                    <strong>${atleta.nombre}</strong>
                                    <small>${atleta.categoria} | ${atleta.sexo}</small>
                                    <small style="color: #666;"><i class="fas fa-map-marker-alt"></i> ${atleta.box || 'Independiente'}</small>
                                </div>
                            </div>
                        </td>
                        <td style="text-align: center;"><span class="badge-dorsal">#${atleta.dorsal}</span></td>
                        <td style="text-align: right; padding-right: 25px;">
                            <span class="total-acumulado">${atleta.totalPts} pts</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } else {
                // ORDENAMIENTO Y DIBUJO DE UN WOD ESPECÍFICO (Exactamente igual que antes)
                aMostrar.sort((a, b) => {
                    let tieneA = a.tieneScoreWod[filtrosCF.wod];
                    let tieneB = b.tieneScoreWod[filtrosCF.wod];
                    if(tieneA !== tieneB) return tieneA ? -1 : 1; 
                    
                    let ptsA = a.wodPtsData[filtrosCF.wod] || 0;
                    let ptsB = b.wodPtsData[filtrosCF.wod] || 0;
                    if(ptsA !== ptsB) return ptsB - ptsA; 
                    
                    if(b.totalPts !== a.totalPts) return b.totalPts - a.totalPts; 
                    return a.dorsal.localeCompare(b.dorsal, undefined, { numeric: true });
                });

                thead.innerHTML = `
                    <tr>
                        <th style="width: 50px; text-align: center;">Pos</th>
                        <th>Atleta / Box</th>
                        <th style="width: 70px; text-align: center;">Dorsal</th>
                        <th style="text-align: right;">Score WOD</th>
                        <th style="text-align: right; padding-right: 25px;">Pts Acumulados</th>
                    </tr>
                `;

                tbody.innerHTML = '';
                if (aMostrar.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:40px; color:#666;">No se encontraron competidores en esta categoría.</td></tr>';
                    return;
                }

                aMostrar.forEach((atleta, index) => {
                    let tieneScoreEnEsteWod = atleta.tieneScoreWod[filtrosCF.wod];
                    let rankNumber = tieneScoreEnEsteWod ? (index + 1) : '-';
                    
                    let claseRank = ""; let contenidoRank = rankNumber; let claseRow = "";
                    let isTop = rankNumber <= 3 && tieneScoreEnEsteWod;

                    if (rankNumber === 1) { claseRank = "rank-1"; contenidoRank = `<i class="fas fa-crown"></i>`; claseRow = "top-1"; }
                    else if (rankNumber === 2) { claseRank = "rank-2"; contenidoRank = `2`; claseRow = "top-2"; }
                    else if (rankNumber === 3) { claseRank = "rank-3"; contenidoRank = `3`; claseRow = "top-3"; }

                    let textScore = tieneScoreEnEsteWod ? atleta.wods_data[filtrosCF.wod].score : '--';
                    let ptsWod = tieneScoreEnEsteWod ? `+${atleta.wodPtsData[filtrosCF.wod]} pts` : '';

                    let tr = document.createElement('tr');
                    tr.className = claseRow;
                    tr.innerHTML = `
                        <td style="display: flex; justify-content: center; align-items: center; height: 60px;">
                            <span class="rank-number ${claseRank}">${contenidoRank}</span>
                        </td>
                        <td>
                            <div class="athlete-profile">
                                <img src="${convertirDriveUrl(atleta.foto)}" alt="Avatar" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                                <div class="athlete-details">
                                    <strong>${atleta.nombre}</strong>
                                    <small>${atleta.categoria} | ${atleta.sexo}</small>
                                    <small style="color: #666;"><i class="fas fa-map-marker-alt"></i> ${atleta.box || 'Independiente'}</small>
                                </div>
                            </div>
                        </td>
                        <td style="text-align: center;"><span class="badge-dorsal">#${atleta.dorsal}</span></td>
                        <td style="text-align: right;">
                            <span class="score-display">${textScore}</span>
                            <div class="points-wod">${ptsWod}</div>
                        </td>
                        <td style="text-align: right; padding-right: 25px;">
                            <span class="total-acumulado">${atleta.totalPts}</span>
                            <span style="display:block; font-size: 0.6rem; color: #888; text-transform: uppercase;">Total General</span>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function procesarYRenderizar() {
            if (modalidadActual === 'Race') {
                procesarRace();
            } else {
                procesarCF();
            }
        }

        window.onload = inicializar;
    </script>
</body>
</html>
