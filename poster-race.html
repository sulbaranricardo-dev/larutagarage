<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Póster IG | La Ruta Garage</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --neon: #d8ff5e; 
            --bg: #000000; 
            --glass: rgba(20, 20, 20, 0.7); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --blur: blur(15px);
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #111; /* Color alrededor del póster */
            font-family: 'RBNo3.1', 'Montserrat', sans-serif; 
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* --- CONTROLES DEL ADMINISTRADOR --- */
        .admin-controls {
            background: #1a1a1a;
            padding: 20px;
            width: 100%;
            text-align: center;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 9999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .filter-row { display: flex; justify-content: center; gap: 10px; }
        .btn-pill { 
            padding: 10px 25px; 
            background: #222; 
            color: #aaa; 
            border: 1px solid #444; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 900; 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-pill:hover { background: #333; color: white; }
        .btn-pill.active { background: var(--neon); color: black; border-color: var(--neon); box-shadow: 0 0 15px rgba(216, 255, 94, 0.2); }
        .page-indicator { color: white; font-weight: 900; font-size: 1rem; width: 120px; }

        /* --- CONTENEDOR DEL PÓSTER (DIMENSIONES EXACTAS 3:4 INSTAGRAM) --- */
        #poster-container {
            width: 1080px; 
            height: 1440px; /* Alto estricto, no se expande */
            padding: 60px 40px; 
            background-color: var(--bg); /* Negro Total Puro */
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Evita que crezca o haga scroll */
            margin-top: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }

        /* HEADER DEL PÓSTER */
        .poster-header { text-align: center; margin-bottom: 40px; }
        .poster-header img { width: 140px; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(216, 255, 94, 0.4)); }
        .poster-header h1 { font-weight: 900; color: white; font-size: 38px; text-transform: uppercase; margin: 0; letter-spacing: 4px; }
        .poster-header h2 { font-weight: 600; color: var(--neon); font-size: 20px; text-transform: uppercase; margin: 5px 0 0 0; letter-spacing: 2px; }

        /* --- LISTA DE ATLETAS (2 COLUMNAS) --- */
        #leaderboard-list { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
            gap: 15px; 
            align-content: start; /* Alinea las tarjetas hacia arriba */
        }

        /* ITEM INDIVIDUAL (GLASSMORPHISM COMPACTO) */
        .athlete-card {
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            height: 95px; /* Altura controlada para que quepan 10 filas */
        }

        .athlete-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background-color: transparent;
        }

        /* SECCIÓN IZQUIERDA: POSICIÓN Y AVATAR */
        .card-left { display: flex; align-items: center; gap: 15px; flex: 0 0 auto; }
        .rank-box { width: 45px; text-align: center; }
        .rank-number { font-weight: 900; font-size: 26px; color: #fff; }
        .rank-icon { font-size: 24px; }

        .avatar-box { position: relative; }
        .avatar-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid #333; background: #222; }
        
        .dorsal-tag {
            position: absolute;
            bottom: -6px; right: -6px;
            background: var(--bg);
            color: var(--neon);
            font-weight: 900;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--neon);
            font-family: monospace;
        }

        /* SECCIÓN CENTRAL: DATOS PERSONALES */
        .card-center { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            padding: 0 10px;
            min-width: 0; /* Evita que el texto largo rompa la grid */
        }
        .athlete-name { 
            font-size: 16px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: white; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .athlete-meta { font-size: 10px; color: #aaa; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
        .athlete-box { font-size: 11px; color: var(--neon); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* SECCIÓN DERECHA: TIEMPO */
        .card-right { flex: 0 0 auto; text-align: right; }
        .time-display { font-weight: 900; font-size: 20px; color: white; font-family: 'Montserrat', monospace; }

        /* --- ESTILOS DE PODIO --- */
        .athlete-card.top-1 { border-color: rgba(255, 215, 0, 0.4); box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .athlete-card.top-1::before { background-color: #ffd700; box-shadow: 0 0 15px #ffd700; }
        .top-1 .rank-number { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .top-1 .rank-icon { color: #ffd700; }
        .top-1 .avatar-img { border-color: #ffd700; }
        .top-1 .time-display { color: #ffd700; }

        .athlete-card.top-2 { border-color: rgba(192, 192, 192, 0.3); }
        .athlete-card.top-2::before { background-color: #c0c0c0; }
        .top-2 .rank-number { color: #c0c0c0; }
        .top-2 .avatar-img { border-color: #c0c0c0; }

        .athlete-card.top-3 { border-color: rgba(205, 127, 50, 0.3); }
        .athlete-card.top-3::before { background-color: #cd7f32; }
        .top-3 .rank-number { color: #cd7f32; }
        .top-3 .avatar-img { border-color: #cd7f32; }

        /* INDICADOR DE PÁGINA EN EL PÓSTER */
        .poster-footer {
            position: absolute;
            bottom: 30px;
            width: calc(100% - 80px);
            text-align: center;
            color: #555;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .poster-loader { text-align: center; padding: 100px; color: var(--neon); font-size: 2rem; font-weight: 900; }

        @media print {
            .admin-controls { display: none !important; }
            body { background: #000; }
            #poster-container { box-shadow: none; border: none; margin: 0; }
        }
    </style>
</head>
<body>

    <div class="admin-controls">
        <div class="filter-row">
            <button class="btn-pill active" id="sex-Masculino" onclick="cambiarSexo('Masculino')">Hombres ♂</button>
            <button class="btn-pill" id="sex-Femenino" onclick="cambiarSexo('Femenino')">Mujeres ♀</button>
        </div>
        <div class="filter-row" style="margin-top: 5px;">
            <button class="btn-pill" onclick="cambiarPagina(-1)"><i class="fas fa-chevron-left"></i> Anterior</button>
            <span class="page-indicator" id="ui-page-indicator">Página 1</span>
            <button class="btn-pill" onclick="cambiarPagina(1)">Siguiente <i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div id="poster-loader" class="poster-loader">
        <i class="fas fa-circle-notch fa-spin"></i> CALCULANDO LÍDERES GENERALES...
    </div>

    <div id="poster-container" style="display:none;">
        
        <div class="poster-header">
            <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/La%20Ruta%20Garage%2FLogo%20Icono%20Verde.png?alt=media&token=07ce2638-9667-4bad-8de1-c38abc5112f8" alt="Logo">
            <h1>LA RUTA GARAGE</h1>
            <h2 id="poster-subtitle">TABLA GENERAL RACE - HOMBRES</h2>
        </div>

        <div id="leaderboard-list">
            </div>

        <div class="poster-footer" id="poster-footer-text">
            1 / 3
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://hzywpjzvlvdxscgtebvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6eXdwanp2bHZkeHNjZ3RlYnZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNjI0OTQsImV4cCI6MjA5NDYzODQ5NH0.L7gdDpxOD7N1gpSoCVI0FEiwxR44sG8XwAORYm16sEM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let atletas = [];
        let sexoActual = 'Masculino'; 
        
        // --- VARIABLES DE PAGINACIÓN ---
        let currentPage = 1;
        const ITEMS_PER_PAGE = 20; // 10 filas x 2 columnas exactas
        let totalPages = 1;
        let atletasProcesados = []; // Aquí guardaremos la lista ya ordenada y calculada

        function convertirDriveUrl(url) {
            if (!url || url.trim() === "") return "https://ui-avatars.com/api/?name=LRG&background=222&color=fff";
            let match = url.match(/\/d\/(.*?)\//);
            return match && match[1] ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w300-h300` : url;
        }

        function calcularEdad(fechaNacStr) {
            if (!fechaNacStr) return 'N/A';
            let nacimiento = new Date(fechaNacStr);
            if (isNaN(nacimiento.getTime())) return 'N/A';
            let hoy = new Date();
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            let m = hoy.getMonth() - nacimiento.getMonth();
            if (m < 0 || (m === 0 && hoy.getDate() < nacimiento.getDate())) { edad--; }
            return edad;
        }

        function scoreToSecondsRace(scoreStr) {
            if (!scoreStr || scoreStr.trim() === "") return Infinity;
            let partes = scoreStr.split(':');
            if (partes.length === 2) return (parseInt(partes[0]) || 0) * 60 + parseFloat(partes[1] || 0);
            let num = parseFloat(scoreStr);
            return isNaN(num) ? Infinity : num;
        }

        async function inicializarPoster() {
            const { data: dataAtletas } = await supabaseClient.from('atletas').select('*');
            if(dataAtletas) atletas = dataAtletas;
            
            document.getElementById('poster-loader').style.display = 'none';
            document.getElementById('poster-container').style.display = 'flex';
            prepararLista();
        }

        function cambiarSexo(nuevoSexo) {
            sexoActual = nuevoSexo;
            currentPage = 1; // Resetea a la primera página al cambiar de sexo
            
            document.querySelectorAll('.btn-pill').forEach(b => b.classList.remove('active'));
            document.getElementById(`sex-${nuevoSexo}`).classList.add('active');
            
            const textoSexo = nuevoSexo === 'Masculino' ? 'HOMBRES' : 'MUJERES';
            document.getElementById('poster-subtitle').innerText = `TABLA GENERAL RACE - ${textoSexo}`;
            
            prepararLista();
        }

        function cambiarPagina(delta) {
            let nuevaPagina = currentPage + delta;
            if (nuevaPagina >= 1 && nuevaPagina <= totalPages) {
                currentPage = nuevaPagina;
                renderizarPagina();
            }
        }

        function prepararLista() {
            // 1. Filtrar
            let filtrados = atletas.filter(a => {
                if (!a.modalidad || !a.modalidad.toLowerCase().includes('race')) return false;
                if (!a.score || a.score.trim() === "") return false; // Solo mostrar quienes tengan tiempo
                return a.sexo === sexoActual;
            });

            // 2. Ordenar
            filtrados.sort((a, b) => {
                let sA = scoreToSecondsRace(a.score);
                let sB = scoreToSecondsRace(b.score);
                if (sA !== sB) return sA - sB;
                return a.dorsal.localeCompare(b.dorsal, undefined, { numeric: true });
            });

            // 3. Asignar el Rango real globalmente antes de paginar
            filtrados.forEach((a, i) => {
                a.rankGeneral = i + 1;
            });

            atletasProcesados = filtrados;
            
            // 4. Calcular Total de Páginas
            totalPages = Math.ceil(atletasProcesados.length / ITEMS_PER_PAGE);
            if (totalPages === 0) totalPages = 1;

            renderizarPagina();
        }

        function renderizarPagina() {
            // Actualizar textos de UI
            document.getElementById('ui-page-indicator').innerText = `Página ${currentPage} de ${totalPages}`;
            document.getElementById('poster-footer-text').innerText = `${currentPage} / ${totalPages}`;

            // Obtener el fragmento de la página actual
            const indexInicio = (currentPage - 1) * ITEMS_PER_PAGE;
            const atletasMostrados = atletasProcesados.slice(indexInicio, indexInicio + ITEMS_PER_PAGE);

            const listaUl = document.getElementById('leaderboard-list');
            listaUl.innerHTML = '';

            atletasMostrados.forEach(atleta => {
                let rankNumber = atleta.rankGeneral;
                let clasePodio = "";
                let contenidoRank = `<span class="rank-number">${rankNumber}</span>`;

                if (rankNumber === 1) { 
                    clasePodio = "top-1"; 
                    contenidoRank = `<span class="rank-icon"><i class="fas fa-crown"></i></span>`; 
                }
                else if (rankNumber === 2) { clasePodio = "top-2"; }
                else if (rankNumber === 3) { clasePodio = "top-3"; }

                const boxAtleta = atleta.box && atleta.box.trim() !== "" ? atleta.box : 'Independiente';
                const edadAtleta = calcularEdad(atleta.fechaNac);

                const cardDiv = document.createElement('div');
                cardDiv.className = `athlete-card ${clasePodio}`;
                cardDiv.innerHTML = `
                    <div class="card-left">
                        <div class="rank-box">
                            ${contenidoRank}
                        </div>
                        <div class="avatar-box">
                            <img src="${convertirDriveUrl(atleta.foto)}" alt="${atleta.nombre}" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${atleta.nombre}&background=222&color=fff'">
                            <span class="dorsal-tag">#${atleta.dorsal}</span>
                        </div>
                    </div>
                    
                    <div class="card-center">
                        <div class="athlete-name">${atleta.nombre}</div>
                        <div class="athlete-meta">Edad: ${edadAtleta} | Sexo: ${atleta.sexo}</div>
                        <div class="athlete-box"><i class="fas fa-map-marker-alt"></i> ${boxAtleta}</div>
                    </div>
                    
                    <div class="card-right">
                        <div class="time-display">${atleta.score}</div>
                    </div>
                `;
                listaUl.appendChild(cardDiv);
            });
        }

        window.onload = inicializarPoster;
    </script>
</body>
</html>
